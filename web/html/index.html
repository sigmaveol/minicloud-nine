<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyMiniCloud by Group 9: a small cloud project covering containers, cloud infrastructure, and web hosting.">
    <title>MyMiniCloud - Home</title>
    <style>
        :root {
            --paper: #f7f6f2;
            --ink: #1c2430;
            --muted: #5b6575;
            --accent: #0f6b6b;
            --rule: #d9d6cc;
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #141a22;
                --ink: #e6e9ee;
                --muted: #9aa4b2;
                --accent: #5fc4c4;
                --rule: #2a3340;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Source Serif 4", Charter, Georgia, serif;
            font-size: 1.125rem;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            max-width: 42rem;
            width: 100%;
            margin: 0 auto;
            padding: 6rem 1.5rem 3rem;
        }

        .eyebrow-rule {
            width: 3rem;
            height: 3px;
            background: var(--accent);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-size: clamp(2.4rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.1;
            margin: 0 0 1.25rem;
        }

        .lead {
            font-size: 1.25rem;
            color: var(--muted);
            margin: 0 0 2.5rem;
            max-width: 32rem;
        }

        .actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-weight: 600;
            color: var(--paper);
            background: var(--accent);
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
        }

        .btn:hover { opacity: 0.9; }

        footer {
            max-width: 42rem;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            border-top: 1px solid var(--rule);
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-size: 0.9rem;
            color: var(--muted);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow-rule" aria-hidden="true"></div>
        <h1>MyMiniCloud - Home</h1>
        <p class="lead">Welcome to Group 9 MiniCloud.</p>

        <div class="actions">
            <a class="btn" href="/blog/">Visit our blog</a>
        </div>
    </main>

    <footer>Group 9 MiniCloud</footer>
</body>
</html>
