<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Articles from the MyMiniCloud blog covering Docker, cloud computing, and Nginx reverse proxies.">
    <title>MyMiniCloud Blog</title>
    <style>
        :root {
            --paper: #f7f6f2;
            --ink: #1c2430;
            --muted: #5b6575;
            --accent: #0f6b6b;
            --rule: #d9d6cc;
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #141a22;
                --ink: #e6e9ee;
                --muted: #9aa4b2;
                --accent: #5fc4c4;
                --rule: #2a3340;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Source Serif 4", Charter, Georgia, serif;
            font-size: 1.125rem;
            line-height: 1.7;
        }

        main {
            max-width: 42rem;
            margin: 0 auto;
            padding: 4rem 1.5rem 3rem;
        }

        header { margin-bottom: 3rem; }

        h1 {
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin: 0 0 0.75rem;
        }

        .subtitle {
            color: var(--muted);
            font-style: italic;
            margin: 0;
        }

        h2 {
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 1.5rem;
        }

        ol.articles {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--rule);
        }

        ol.articles li {
            border-bottom: 1px solid var(--rule);
        }

        ol.articles a {
            display: block;
            padding: 1.5rem 0;
            color: var(--ink);
            text-decoration: none;
        }

        .article-title {
            display: block;
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }

        .article-meta {
            display: block;
            font-size: 0.95rem;
            color: var(--muted);
        }

        ol.articles a:hover .article-title {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        ol.articles a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        nav.pagination {
            margin-top: 3rem;
            font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        }

        nav.pagination a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }

        nav.pagination a:hover { border-bottom-color: var(--accent); }

        nav.pagination a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>MyMiniCloud - Personal Blog</h1>
            <p class="subtitle">Notes on containers, cloud infrastructure, and web hosting.</p>
        </header>

        <h2>Articles</h2>

        <ol class="articles">
            <li>
                <a href="/blog/blog1.html">
                    <span class="article-title">Blog 1 - Introduction to Docker</span>
                    <span class="article-meta">Containers and images</span>
                </a>
            </li>
            <li>
                <a href="/blog/blog2.html">
                    <span class="article-title">Blog 2 - Cloud Computing Basics</span>
                    <span class="article-meta">Cloud infrastructure</span>
                </a>
            </li>
            <li>
                <a href="/blog/blog3.html">
                    <span class="article-title">Blog 3 - Nginx and Reverse Proxy</span>
                    <span class="article-meta">Web hosting and request routing</span>
                </a>
            </li>
        </ol>

        <nav class="pagination">
            <a href="/">Back to Home</a>
        </nav>
    </main>
</body>
</html>
