events {}

http {
    upstream web_cluster {
        server web-frontend-server:80;
        server web-frontend-server2:80;
    }

    # 1. Chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name 18.143.192.118.nip.io;
        return 301 https://$host$request_uri;
    }

    # 2. Server HTTPS chính
    server {
        listen 443 ssl;
        server_name 18.143.192.118.nip.io;

        # Chứng chỉ SSL
        ssl_certificate /etc/letsencrypt/live/18.143.192.118.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/18.143.192.118.nip.io/privkey.pem;
        
        # Giao thức bảo mật
        ssl_protocols TLSv1.2 TLSv1.3;

        # Load Balancing Web
        location / {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Backend $upstream_addr always;
        }

        # API
        location /api/ {
            proxy_pass http://application-backend-server:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /student/
        location = /student { return 301 /student/; }
        location /student/ {
            proxy_pass http://application-backend-server:8081/student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak (CHÚ Ý: Đã xóa dấu "/" ở cuối proxy_pass)
        location /auth/ {
            proxy_pass http://authentication-identity-server:8080; # <-- Không có dấu /
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}